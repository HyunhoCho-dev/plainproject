services:
  # PostgreSQL 실제 데이터베이스 (창고) 서비스 정의
  db:
    image: postgres:15-alpine
    container_name: plainproject-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plaindb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # 백엔드 스프링 부트 서버 서비스 정의
  backend:
    # 이 디렉토리(.)에 있는 Dockerfile을 읽어서 이미지를 직접 빌드합니다.
    build:
      context: .
      dockerfile: Dockerfile
    # 도커 컨테이너의 이름을 알기 쉽게 지정해줍니다.
    container_name: plainproject-backend
    # 외부(내 컴퓨터)에서 8080 포트로 접속하면, 컨테이너 내부의 8080 포트로 연결해줍니다. (Host:Container)
    ports:
      - "8080:8080"
    # 컨테이너가 켜질 때 환경 변수(Environment Variables)를 주입할 수 있습니다.
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 실제 PostgreSQL DB 접속 정보를 환경 변수로 주입합니다.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/plaindb
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    # 백엔드는 창고(db)가 먼저 켜진 다음에 켜져야 하므로 의존성을 걸어줍니다.
    depends_on:
      - db
    restart: always

# 볼륨 정의: 데이터를 날아가지 않게 보관할 실제 하드디스크의 창고 공간입니다.
volumes:
  db_data:
