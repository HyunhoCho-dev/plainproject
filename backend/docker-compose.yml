services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plainproject-backend
    ports:
      - "8080:8080"
    volumes:
      - ../prototype:/prototype:ro
    command:
      - "--plain.prototype-path=/prototype/"
      - "--plain.ai.base-url=http://host.docker.internal:3000"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: always