// [백엔드 가이드] 프로젝트의 심장이자 조립 설명서입니다. 
// 어떤 도구(라이브러리)를 가져다 쓸지, 어떤 버전의 자바를 쓸지 여기서 모두 결정합니다.

plugins {
    // 스프링 부트와 자바를 편하게 쓸 수 있게 해주는 기본 플러그인(기능 확장팩)들을 장착합니다.
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.plain' // 우리 프로젝트를 만든 조직(회사)의 고유 이름입니다. (보통 웹사이트 도메인을 뒤집어서 씁니다)
version = '0.0.1-SNAPSHOT' // 우리 앱의 현재 버전입니다. SNAPSHOT은 아직 개발이 진행 중이라는 뜻입니다.

java {
	toolchain {
        // 우리 프로젝트는 자바(Java) 17 버전을 기준으로 굴러간다고 명시합니다.
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
    // 아래 dependencies에서 요청한 라이브러리들을 다운로드받을 인터넷 마켓(저장소) 주소입니다. 
    // mavenCentral()은 전 세계에서 가장 큰 오픈소스 라이브러리 마켓입니다.
	mavenCentral()
}

dependencies {
    // [가장 중요한 부분] 프로젝트에 필요한 외부 라이브러리(도구)들을 적어두면 Gradle이 알아서 다운받아줍니다.
    
    // [implementation: 일반적인 핵심 기능에 사용되는 라이브러리]
	implementation 'org.springframework.boot:spring-boot-starter-security' // 스프링 시큐리티(인증 및 권한)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client' // 소셜 로그인 (OAuth2)
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // JWT 토큰 API
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5' // JWT 토큰 구현체
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JWT JSON 파싱
	
	implementation 'org.springframework.boot:spring-boot-h2console' // H2 데이터베이스 안의 내용을 웹 브라우저에서 시각적으로 볼 수 있게 해주는 기능입니다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // 자바 코드와 DB 테이블을 아주 편하게 연결해주는 마법의 데이터베이스 툴(JPA)입니다.
	implementation 'org.springframework.boot:spring-boot-starter-validation' // 유저가 가입할 때 입력한 이메일 형식 등이 맞는지 쉽게 검사해주는 도구입니다.
	implementation 'org.springframework.boot:spring-boot-starter-webmvc' // 웹 서버(API) 기능을 만들 때 가장 뼈대가 되는 필수적인 스프링 웹 툴킷입니다.
	
    // [compileOnly, annotationProcessor: 코드를 짤 때만 필요하고, 최종 배포 시에는 빠져서 용량을 줄여주는 도구들]
	compileOnly 'org.projectlombok:lombok' // @Getter, @Setter 등 지루하게 반복되는 코드를 자동으로 만들어주는 엄청나게 편리한 도구입니다.
	annotationProcessor 'org.projectlombok:lombok' // 롬복 라이브러리가 뒤에서 몰래 코드를 짜주도록 작동시키는 톱니바퀴 역할입니다.
    
    // [developmentOnly: 개발자의 로컬 환경(내 컴퓨터)에서만 쓰이는 도구]
	developmentOnly 'org.springframework.boot:spring-boot-devtools' // 코드를 수정하고 저장할 때마다 서버를 껐다 켜지 않아도 자동으로 새로고침 해주는 개발 꿀템입니다.
	
    // [runtimeOnly: 코드를 짤 때는 굳이 안 보이지만, 프로그램이 실제로 켜져서 돌아갈 때 필요한 도구]
	runtimeOnly 'com.h2database:h2' // 실질적인 인메모리(연습용) 데이터베이스 엔진 그 자체입니다.

    // ==============================================================================
    // [테스트 전용 무기들 (test~ 로 시작하는 것들)]
    // 개발자가 코드를 다 짜고 나서 "이 코드가 진짜로 잘 돌아가나?" 하고 가상으로 실험(테스트)을 해볼 때만
    // 잠깐 꺼내서 쓰는 무기들입니다. 실제 사용자들에게 배포되는 진짜 프로그램에는 포함되지 않아서 용량도 아끼고 안전합니다.
    // ==============================================================================
    
    // spring-boot-starter-data-jpa-test: 
    // "내가 만든 DB 창고(UserRepository)가 진짜로 데이터를 잘 저장하는지 가짜 메모리 DB를 띄워서 실험해볼게!" 할 때 쓰는 마법 도구입니다.
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test' 
    
    // spring-boot-starter-validation-test: 
    // "사용자가 비밀번호를 너무 짧게 쳤을 때, 내 코드가 철통방어를 하며 에러를 잘 뱉어내는지 실험해볼게!" 할 때 쓰는 검사 도구입니다.
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test' 
    
    // spring-boot-starter-webmvc-test: 
    // "사용자가 인터넷 주소창에 접속했을 때, 내 웹 서버가 진짜로 응답을 잘 하는지 가상 인터넷으로 찔러볼게!" 할 때 쓰는 모의 통신 도구입니다.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test' 
    
    // 테스트용 롬복(Lombok) 세팅: 테스트 코드를 짤 때도 롬복 마법사(자동완성)를 쓰겠다는 뜻입니다.
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

    // junit-platform-launcher: 
    // 위에서 만든 모든 테스트 실험들을 실제로 초록색 버튼을 눌러서 웽~ 하고 '실행(Launch)' 시켜주는 메인 엔진(모터)입니다. 이게 없으면 테스트 코드가 안 돌아갑니다.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher' 
}

// tasks.named('test'): "앞으로 개발자가 '테스트 돌려줘!' 라고 명령을 내리면 아래의 중괄호 { } 내용을 실행해" 라는 설정입니다.
tasks.named('test') {
    // useJUnitPlatform(): 전 세계 자바 개발자들의 99%가 쓰는 'JUnit'이라는 가장 유명한 테스트 기계를 사용해서 실험을 돌리겠다는 선언입니다.
	useJUnitPlatform()
}
