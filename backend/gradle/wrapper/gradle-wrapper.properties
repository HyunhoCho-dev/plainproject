# [백엔드 가이드] gradle-wrapper.properties 파일
# 이 파일은 팀원 백 명이 모두 100% 똑같은 버전의 '빌드 도구(Gradle)'를 쓰게 만들기 위한 설정 파일입니다.
# 등호(=)를 기준으로 왼쪽은 '설정 이름', 오른쪽은 '설정 값'을 의미합니다.

# distributionBase: 컴퓨터가 인터넷에서 알아서 다운로드받은 Gradle을 어디에 풀어서 저장할지 기본 기준점(폴더)을 정합니다. GRADLE_USER_HOME은 내 컴퓨터의 사용자 폴더를 의미합니다.
distributionBase=GRADLE_USER_HOME

# distributionPath: 위에서 정한 기준점 안에서, 구체적으로 어떤 하위 폴더(wrapper/dists)에 풀어서 저장할지 경로를 정합니다.
distributionPath=wrapper/dists

# distributionUrl: (가장 핵심!) "만약 내 컴퓨터에 이 버전이 없으면, 저기 적힌 인터넷 주소(https://...)에서 Gradle 9.5.1 버전을 알아서 다운로드 받아와라!" 라는 명령입니다.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip

# networkTimeout: 다운로드를 시도할 때 인터넷이 너무 느리거나 끊기면, 몇 초(10000ms = 10초) 동안 기다려보고 포기할지 정하는 시간 제한입니다.
networkTimeout=10000

# retries: 만약 다운로드가 실패했을 때, 포기하지 않고 몇 번 더 다시 시도할지(재시도 횟수) 정합니다. 0이므로 실패하면 얄짤없이 바로 끝냅니다.
retries=0

# retryBackOffMs: 만약 재시도(retries)를 한다면, 실패 직후 바로 시도하지 말고 몇 초(500ms = 0.5초)를 쉬었다가 다시 시도할지 정하는 대기 시간입니다.
retryBackOffMs=500

# validateDistributionUrl: 위에서 적은 다운로드 주소(distributionUrl)가 안전하고 정확한 주소인지 다운로드 전에 한 번 깐깐하게 검사해볼 것인가(true)를 결정합니다.
validateDistributionUrl=true

# zipStoreBase: 다운로드받은 원본 압축파일(.zip) 자체를 어디에 보관할지 기준점을 정합니다.
zipStoreBase=GRADLE_USER_HOME

# zipStorePath: 다운로드받은 원본 압축파일(.zip)을 기준점 안의 구체적으로 어떤 하위 폴더에 보관할지 정합니다.
zipStorePath=wrapper/dists
