name: PLAIN real AI integration check

on:
  push:
    branches:
      - all
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plain-real-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # The value stays in GitHub Actions Secrets and is never committed.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: deepseek/deepseek-v4-flash

    steps:
      - name: Check out the all branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Ensure the OpenRouter secret exists
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY GitHub Secret is missing."
            exit 1
          fi

      - name: Install and test the AI server
        working-directory: ai
        run: |
          npm ci
          npm test

      - name: Build the Spring backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Start the AI server
        shell: bash
        run: |
          node ai/src/server.js > ai-server.log 2>&1 &
          echo $! > ai-server.pid

      - name: Wait for the AI server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ai-server.log
          exit 1

      - name: Start the Spring backend
        shell: bash
        run: |
          cd backend
          # Real LLM latency varies, so the integration runner allows up to three minutes.
          ./gradlew bootRun --args='--plain.ai.timeout-seconds=180' > ../backend-server.log 2>&1 &
          echo $! > ../backend-server.pid

      - name: Wait for the Spring backend
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/prototype/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat backend-server.log
          exit 1

      - name: Run the real end-to-end AI check
        run: node scripts/integration-smoke.mjs

      - name: Show server logs when the check fails
        if: failure()
        shell: bash
        run: |
          echo "--- AI server ---"
          cat ai-server.log 2>/dev/null || true
          echo "--- Spring backend ---"
          cat backend-server.log 2>/dev/null || true

      - name: Stop test servers
        if: always()
        shell: bash
        run: |
          if [ -f backend-server.pid ]; then kill "$(cat backend-server.pid)" 2>/dev/null || true; fi
          if [ -f ai-server.pid ]; then kill "$(cat ai-server.pid)" 2>/dev/null || true; fi
