<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — 집중 지원 앱</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <header class="appbar"></header>

      <section class="pad mt-8 mb-8">
        <div style="width:48px; height:48px; border-radius:var(--r-md);
                    background:var(--accent)" class="mb-6"></div>
        <h1 class="t-h1">다시 오셨네요</h1>
      </section>

      <!-- 아이디·비밀번호 + 로그인 버튼 -->
      <section class="pad">
        <label class="field">
          <span class="t-caption field__label">아이디</span>
          <input class="field__input" placeholder="아이디를 입력하세요">
        </label>
        <label class="field">
          <span class="t-caption field__label">비밀번호</span>
          <input class="field__input" type="password" placeholder="비밀번호를 입력하세요">
          <!-- 아이디·비밀번호 중 무엇이 틀렸는지는 구분하지 않는다 -->
          <span class="t-caption field__error">아이디 또는 비밀번호가 올바르지 않습니다</span>
        </label>

        <button class="btn btn--primary btn--block mt-6">로그인</button>

        <!-- 자동 로그인 체크박스 -->
        <label class="mt-4" style="display:flex; align-items:center; gap:var(--space-2); cursor:pointer">
          <span style="width:20px; height:20px; border-radius:var(--r-sm);
                       background:var(--accent); display:grid; place-items:center; color:#fff; font-size:12px">✓</span>
          <span class="t-body-sm muted">자동 로그인</span>
        </label>
      </section>

      <!-- 소셜 로그인 3개 -->
      <section class="pad mt-8">
        <div style="display:flex; align-items:center; gap:var(--space-3)" class="mb-4">
          <i style="flex:1; height:1px; background:var(--border)"></i>
          <span class="t-caption muted3">간편 로그인</span>
          <i style="flex:1; height:1px; background:var(--border)"></i>
        </div>
        <button class="social social--kakao"><i class="social__mark" style="background:#191600"></i>카카오로 계속하기</button>
        <button class="social social--naver"><i class="social__mark" style="background:#fff"></i>네이버로 계속하기</button>
        <button class="social social--google"><i class="social__mark" style="background:var(--surface-2)"></i>구글로 계속하기</button>
      </section>

      <!-- 아이디 찾기 · 비밀번호 재설정 (전화번호 인증 기반) -->
      <section class="pad mt-6 mb-8" style="text-align:center">
        <button class="btn btn--text t-caption">아이디 찾기</button>
        <span class="t-caption muted3">·</span>
        <button class="btn btn--text t-caption">비밀번호 재설정</button>
        <p class="t-caption muted3 mt-2">가입 시 인증한 전화번호로 확인합니다</p>
      </section>

    </div><!-- /screen -->
  </div><!-- /phone -->
</div>

</body>
</html>
