<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계획 생성 결과 — 집중 지원 앱</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
</head>
<body data-page="plan-result.html">

<div class="stage">
  <div class="phone">
    <div class="screen" style="padding-bottom:132px">

      <header class="appbar"></header>

      <section class="pad">
        <span class="badge badge--ai t-micro">AI 분석 중</span>
        <h1 class="t-h1 mt-4 mb-3">계획을 만들고 있어요</h1>
        <p class="t-body muted">입력한 내용으로 계획을 불러오는 중입니다.</p>
      </section>

      <!-- (1)(2)(3) 분석 결과 카드 -->
      <section class="pad mt-8">
        <div class="stack" style="gap:var(--space-3)">

          <div class="card">
            <span class="t-caption muted">예상 목표 달성 기간</span>
            <p class="t-h2 mt-2"><span class="num">계산 중…</span></p>
            <p class="t-caption muted3 mt-2"></p>
          </div>

          <div class="card">
            <span class="t-caption muted">주간 추천 학습시간</span>
            <p class="t-h2 mt-2"><span class="num">계산 중…</span></p>
            <p class="t-caption muted3 mt-2"></p>
          </div>

          <div class="card">
            <span class="t-caption muted">첫 주 집중 영역</span>
            <p class="t-h2 mt-2">계산 중…</p>
            <p class="t-caption muted3 mt-2"></p>
          </div>

        </div>
      </section>

      <!-- (4) AI 처방 코멘트 -->
      <section class="pad mt-6">
        <div class="ai-card">
          <span class="badge badge--ai t-micro">AI 처방</span>
          <p class="t-body ai-card__body">실시간 AI 결과를 기다리고 있습니다.</p>
          <button class="btn btn--quiet">근거 보기</button>
        </div>
      </section>

    </div><!-- /screen -->

    <div class="footbar">
      <button class="btn btn--primary btn--block">계획 확인하러 가기</button>
    </div>

  </div><!-- /phone -->
</div>

  <script src="../shared/api.js" defer></script>
  <script src="../shared/live.js" defer></script>
  <script src="../shared/app.js" defer></script>
</body>
</html>
