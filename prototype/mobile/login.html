<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — 집중 지원 앱</title>
  <link rel="icon" href="../shared/logo.png">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
</head>
<body data-page="login.html">

<div class="stage">
  <div class="phone">
    <div class="screen">

      <header class="appbar"></header>

      <section class="pad mt-8 mb-8">
        <img src="../shared/logo.png" alt="Plain" width="48" height="48"
             style="border-radius:var(--r-md); display:block" class="mb-6">
        <h1 class="t-h1">다시 오셨네요</h1>
      </section>

      <!-- 아이디·비밀번호 + 로그인 버튼 -->
      <section class="pad">
        <label class="field">
          <span class="t-caption field__label">아이디</span>
          <input class="field__input" placeholder="아이디를 입력하세요">
        </label>
        <label class="field">
          <span class="t-caption field__label">비밀번호</span>
          <input class="field__input" type="password" placeholder="비밀번호를 입력하세요">
          <!-- 아이디·비밀번호 중 무엇이 틀렸는지는 구분하지 않는다 -->
        </label>

        <button class="btn btn--primary btn--block mt-6">로그인</button>
      </section>

      <!-- 소셜 로그인 3개 -->
      <section class="pad mt-8">
        <div style="display:flex; align-items:center; gap:var(--space-3)" class="mb-4">
          <i style="flex:1; height:1px; background:var(--border)"></i>
          <span class="t-caption muted3">간편 로그인</span>
          <i style="flex:1; height:1px; background:var(--border)"></i>
        </div>
        <button class="social social--kakao"><i class="social__mark" style="background:#191600"></i>카카오로 계속하기</button>
        <button class="social social--naver"><i class="social__mark" style="background:#fff"></i>네이버로 계속하기</button>
        <button class="social social--google"><i class="social__mark" style="background:var(--surface-2)"></i>구글로 계속하기</button>
      </section>

      <!-- 아직 만들어진 계정 기능은 회원가입 하나뿐이라 그것만 둔다.
           아이디 찾기·비밀번호 재설정은 화면도 API도 없어서 넣지 않았다. -->
      <section class="pad mt-6 mb-8" style="text-align:center">
        <span class="t-caption muted3">아직 계정이 없으신가요?</span>
        <button class="btn btn--text t-caption">회원가입</button>
      </section>

    </div><!-- /screen -->
  </div><!-- /phone -->
</div>

  <script src="../shared/api.js" defer></script>
  <script src="../shared/live.js" defer></script>
  <script src="../shared/app.js" defer></script>
</body>
</html>
