<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>목표 시간 입력 — 집중 지원 앱</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
</head>
<body data-page="goal-time.html">

<div class="stage">
  <div class="phone">
    <div class="screen" style="padding-bottom:132px">

      <header class="appbar">
        <button class="icon-btn" aria-label="뒤로">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M12 5l-6 5 6 5" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <!-- 단계 인디케이터 1/3 -->
      <div class="pad mb-8">
        <div class="steps">
          <i data-on="true"></i><i></i><i></i>
        </div>
      </div>

      <section class="pad">
        <h1 class="t-h1 mb-3">하루에 몇 시간<br>공부할 수 있나요?</h1>
        <p class="t-body muted">이 시간을 기준으로 AI가 계획을 짭니다.<br>나중에 언제든 바꿀 수 있어요.</p>
      </section>

      <!-- 숫자 스테퍼 -->
      <section class="pad mt-8" style="padding-block:var(--space-10) 0">
        <div class="stepper">
          <button class="stepper__btn" aria-label="30분 줄이기">−</button>
          <div class="stepper__value">
            <span class="t-display num">2.5</span>
            <span class="t-h3 muted3">시간</span>
          </div>
          <button class="stepper__btn" aria-label="30분 늘리기">+</button>
        </div>
        <p class="t-caption muted3 mt-6" style="text-align:center">30분 단위로 조절됩니다</p>
      </section>

      <!-- 빠른 선택 -->
      <section class="pad mt-8">
        <div class="chip-row" style="justify-content:center">
          <button class="chip">1시간</button>
          <button class="chip">2시간</button>
          <button class="chip" aria-selected="true">2.5시간</button>
          <button class="chip">4시간</button>
        </div>
      </section>

    </div><!-- /screen -->

    <div class="footbar">
      <button class="btn btn--primary btn--block">다음</button>
    </div>

  </div><!-- /phone -->
</div>

  <script src="../shared/app.js" defer></script>
</body>
</html>
