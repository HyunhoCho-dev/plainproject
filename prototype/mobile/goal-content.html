<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>목표 내용 입력 — 집중 지원 앱</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
</head>
<body data-page="goal-content.html">

<div class="stage">
  <div class="phone">
    <div class="screen" style="padding-bottom:132px">

      <header class="appbar">
        <button class="icon-btn" aria-label="뒤로">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M12 5l-6 5 6 5" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <div class="pad mb-8">
        <div class="steps">
          <i data-on="true"></i><i data-on="true"></i><i data-on="true"></i>
        </div>
      </div>

      <section class="pad">
        <h1 class="t-h1 mb-3">무엇을 이루고<br>싶으신가요?</h1>
        <p class="t-body muted">구체적으로 쓸수록 계획이 정확해집니다.</p>
      </section>

      <section class="pad mt-6">
        <label class="field">
          <textarea class="field__area"
            placeholder="언제까지 무엇을 이루고 싶은지 직접 입력해주세요"></textarea>
          <span class="t-caption field__help">언제까지, 무엇을 — 이 두 가지가 들어가면 좋습니다</span>
        </label>
      </section>

    </div><!-- /screen -->

    <div class="footbar">
      <button class="btn btn--primary btn--block">계획 만들기</button>
    </div>

  </div><!-- /phone -->
</div>

  <script src="../shared/api.js" defer></script>
  <script src="../shared/live.js" defer></script>
  <script src="../shared/app.js" defer></script>
</body>
</html>
