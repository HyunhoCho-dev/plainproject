<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>알림 접근 권한 동의 — 집중 지원 앱</title>
  <link rel="icon" href="../shared/logo.png">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
</head>
<body data-page="notify-permission.html">

<div class="stage">
  <div class="phone">
    <div class="screen" style="padding-bottom:160px">

      <header class="appbar"></header>

      <!--
        집중모드 최초 진입 시 1회 노출되는 전체화면 안내 카드 (agy B-2).
        차단 기능보다 먼저 확정되어야 하는 항목이라 문구를 그대로 쓴다.
      -->
      <section class="pad mt-8">
        <h1 class="t-h1 mb-3">알림을 걸러내려면<br>권한이 필요해요</h1>
        <p class="t-body muted">
          집중 세션 중에 들어오는 알림을 AI가 판단해 잠시 미뤄둡니다.
        </p>
      </section>

      <!-- 무엇을 보는지 / 안 보는지 -->
      <section class="pad mt-8">
        <div class="list">
          <div class="list-row">
            <span style="color:var(--success)">✓</span>
            <span class="t-body-sm list-row__label">
              확인하는 것
              <small>앱 이름, 사용 시간, 알림을 보낸 앱 이름</small>
            </span>
          </div>
          <div class="list-row">
            <span class="muted3">✕</span>
            <span class="t-body-sm list-row__label">
              확인하지 않는 것
              <small>메시지 내용, 게시물 내용, 대화 상대</small>
            </span>
          </div>
        </div>
      </section>

      <!-- 확정 문구 (DESIGN.md §7) -->
      <section class="pad mt-6">
        <div class="ai-card">
          <span class="badge badge--ai t-micro">AI 처리 방식</span>
          <p class="t-body ai-card__body" style="margin-bottom:0">
            AI는 어떤 앱을 얼마나 사용했는지, 알림을 보낸 앱 이름만 확인하며
            메시지·게시물 내용은 읽지 않습니다
          </p>
        </div>
      </section>

      <section class="pad mt-6">
        <p class="t-caption muted3">
          거부해도 앱은 그대로 사용할 수 있어요. 차단 기능만 꺼지고,
          마이페이지에서 언제든 다시 켤 수 있습니다.
        </p>
      </section>

    </div><!-- /screen -->

    <div class="footbar">
      <button class="btn btn--primary btn--block">권한 허용하기</button>
      <button class="btn btn--text btn--block mt-2">나중에 할게요</button>
    </div>

  </div><!-- /phone -->
</div>

  <script src="../shared/api.js" defer></script>
  <script src="../shared/live.js" defer></script>
  <script src="../shared/app.js" defer></script>
</body>
</html>
