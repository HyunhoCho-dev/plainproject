<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계획 편집 (바텀시트) — 집중 지원 앱</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
</head>
<body data-page="plan-edit.html">

<div class="stage">
  <div class="phone">

    <!-- 뒤에 깔린 홈 화면 -->
    <div class="screen screen--tabbed">
      <header class="appbar"><h1 class="t-h1 appbar__title">계획</h1></header>

      <section class="pad mb-6">
        <div class="goal-card">
          <div class="goal-card__top">
            <span class="t-h3 goal-card__name">현재 계획</span>
            <span class="t-caption goal-card__dday num">D-27</span>
          </div>
          <div class="goal-card__rate">
            <strong class="t-h1 num">68</strong><span class="t-h3">%</span>
            <span class="t-caption" style="margin-left:auto">0분 / 0분</span>
          </div>
          <div class="gauge"><i style="width:0%"></i></div>
        </div>
      </section>

      <section class="pad">
        <ul class="plan-list" style="list-style:none">
          <li class="plan-block" data-state="done">
            <button class="plan-block__check" aria-label="완료 해제">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 6.2L4.6 8.8L10 3.4" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div>
              <div class="plan-block__head">
                <span class="t-caption plan-block__time num">07:30 – 08:30</span>
                <span class="badge badge--ai t-micro">AI 추천</span>
              </div>
              <p class="t-h3 plan-block__title">개념 정리 — 소프트웨어 설계</p>
            </div>
          </li>
          <li class="plan-block">
            <button class="plan-block__check" aria-label="완료 표시"></button>
            <div>
              <div class="plan-block__head">
                <span class="t-caption plan-block__time num">14:00 – 15:00</span>
                <span class="badge badge--user t-micro">직접 추가</span>
              </div>
              <p class="t-h3 plan-block__title">오답 노트 정리</p>
            </div>
          </li>
        </ul>
      </section>
    </div>

    <div class="dim"></div>

    <!--
      롱프레스로 열리는 인라인 수정 시트.
      별도 페이지 이동 없이 시트 안에서 즉시 반영한다 (agy A-2).
    -->
    <div class="bottom-sheet" role="dialog" aria-label="일정 수정">
      <div class="bottom-sheet__handle"></div>
      <h2 class="t-h2 bottom-sheet__title">일정 수정</h2>

      <label class="field">
        <span class="t-caption field__label">제목</span>
        <input class="field__input" value="오답 노트 정리">
      </label>

      <div class="field">
        <span class="t-caption field__label">시간</span>
        <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:var(--space-2)">
          <input class="field__input num" value="14:00" style="text-align:center">
          <span class="t-body muted3">–</span>
          <input class="field__input num" value="15:00" style="text-align:center">
        </div>
      </div>

      <label class="field">
        <span class="t-caption field__label">메모</span>
        <textarea class="field__area" style="min-height:76px"
                  placeholder="기억할 내용을 적어두세요">3장 오답 위주로</textarea>
      </label>

      <div class="mt-6" style="display:grid; grid-template-columns:1fr 2fr; gap:var(--space-2)">
        <button class="btn btn--quiet">삭제</button>
        <button class="btn btn--primary">저장</button>
      </div>
    </div>

    <nav class="tabbar">
      <button class="tabbar__item" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M4 9.5L11 4l7 5.5V18a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1V9.5Z"
                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg><span class="t-micro">홈</span>
      </button>
      <button class="tabbar__item">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M5 17V11M11 17V5M17 17v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg><span class="t-micro">통계</span>
      </button>
      <button class="tabbar__item">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <circle cx="11" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M4.5 18c.9-3 3.4-4.5 6.5-4.5S16.6 15 17.5 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg><span class="t-micro">마이페이지</span>
      </button>
    </nav>

  </div><!-- /phone -->
</div>

  <script src="../shared/api.js" defer></script>
  <script src="../shared/live.js" defer></script>
  <script src="../shared/app.js" defer></script>
</body>
</html>
