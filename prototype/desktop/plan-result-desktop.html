<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계획 생성 결과 · PC — 집중 지원 앱</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
  <link rel="stylesheet" href="../shared/desktop.css">
  <style>
    /* 온보딩은 사이드바 없이 중앙 정렬 — 목표에만 집중시킨다 */
    .onboard {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-6);
    }
    .onboard__inner { width: 100%; max-width: 640px; }
  </style>
</head>
<body data-page="plan-result-desktop.html">

<div class="onboard">
  <div class="onboard__inner">

    <span class="badge badge--ai t-micro">AI 분석 중</span>
    <h1 class="t-h1 mt-4 mb-3">계획을 만들고 있어요</h1>
    <p class="t-body muted mb-8">입력한 내용으로 계획을 불러오는 중입니다.</p>

    <!-- PC는 가로가 넓으니 3개 카드를 나란히 -->
    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--space-3)" class="mb-4">
      <div class="card">
        <span class="t-caption muted">예상 달성 기간</span>
        <p class="t-h2 mt-2 num">계산 중…</p>
      </div>
      <div class="card">
        <span class="t-caption muted">주간 추천 시간</span>
        <p class="t-h2 mt-2 num">계산 중…</p>
      </div>
      <div class="card">
        <span class="t-caption muted">첫 주 집중 영역</span>
        <p class="t-h2 mt-2">계산 중…</p>
      </div>
    </div>

    <div class="ai-card mb-8">
      <span class="badge badge--ai t-micro">AI 처방</span>
      <p class="t-body ai-card__body">실시간 AI 결과를 기다리고 있습니다.</p>
      <button class="btn btn--quiet">근거 보기</button>
    </div>

    <div style="display:flex; gap:var(--space-3)">
      <button class="btn btn--primary" style="flex:1">계획 확인하러 가기</button>
      <button class="btn btn--outline">조건 바꾸기</button>
    </div>

  </div>
</div>

  <script src="../shared/api.js" defer></script>
  <script src="../shared/live.js" defer></script>
  <script src="../shared/app.js" defer></script>
</body>
</html>
