<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈(계획) — 집중 지원 앱</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- 상단 바 -->
      <header class="appbar">
        <h1 class="t-h1">계획</h1>
        <button class="icon-btn" aria-label="이번 주 계획 다시 만들기">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="4"  r="1.6" fill="currentColor"/>
            <circle cx="10" cy="10" r="1.6" fill="currentColor"/>
            <circle cx="10" cy="16" r="1.6" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <!-- 목표 요약 카드 -->
      <section class="pad" style="margin-bottom: var(--space-6)">
        <div class="goal-card">
          <div class="goal-card__top">
            <span class="t-h3 goal-card__name">정보처리기사 필기 합격</span>
            <span class="t-caption goal-card__dday num">D-27</span>
          </div>
          <div class="goal-card__rate">
            <strong class="t-h1 num">68</strong>
            <span class="t-h3">%</span>
            <span class="t-caption" style="margin-left:auto">34시간 / 50시간</span>
          </div>
          <div class="gauge"><i style="width:68%"></i></div>
        </div>
      </section>

      <!-- 주간 날짜 스트립 -->
      <nav class="datestrip" aria-label="주간 날짜" style="margin-bottom: var(--space-6)">
        <button class="dateitem"><span class="t-micro">월</span><b class="t-body-sm">11</b><i class="dateitem__dot"></i></button>
        <button class="dateitem"><span class="t-micro">화</span><b class="t-body-sm">12</b><i class="dateitem__dot"></i></button>
        <button class="dateitem" aria-selected="true"><span class="t-micro">수</span><b class="t-body-sm">13</b><i class="dateitem__dot"></i></button>
        <button class="dateitem"><span class="t-micro">목</span><b class="t-body-sm">14</b><i class="dateitem__dot"></i></button>
        <button class="dateitem"><span class="t-micro">금</span><b class="t-body-sm">15</b><i class="dateitem__dot"></i></button>
        <button class="dateitem" data-empty="true"><span class="t-micro">토</span><b class="t-body-sm">16</b><i class="dateitem__dot"></i></button>
        <button class="dateitem" data-empty="true"><span class="t-micro">일</span><b class="t-body-sm">17</b><i class="dateitem__dot"></i></button>
      </nav>

      <!-- 일정 목록 -->
      <section class="pad">
        <ul class="plan-list" style="list-style:none">

          <!-- 완료 -->
          <li class="plan-block" data-state="done">
            <button class="plan-block__check" aria-label="완료 해제">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 6.2L4.6 8.8L10 3.4" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div>
              <div class="plan-block__head">
                <span class="t-caption plan-block__time num">07:30 – 08:30</span>
                <span class="badge badge--ai t-micro">AI 추천</span>
              </div>
              <p class="t-h3 plan-block__title">개념 정리 — 소프트웨어 설계</p>
            </div>
          </li>

          <!-- 진행중 -->
          <li class="plan-block" data-state="active">
            <button class="plan-block__check" aria-label="완료 표시"></button>
            <div>
              <div class="plan-block__head">
                <span class="t-caption plan-block__time num">10:00 – 11:30</span>
                <span class="badge badge--ai t-micro">AI 추천</span>
              </div>
              <span class="t-micro plan-block__now">진행중</span>
              <p class="t-h3 plan-block__title">기출문제 풀이</p>
              <p class="t-caption plan-block__meta">AI 예상 소요시간 1시간 30분</p>
            </div>
          </li>

          <!-- 예정 · 직접 추가 -->
          <li class="plan-block">
            <button class="plan-block__check" aria-label="완료 표시"></button>
            <div>
              <div class="plan-block__head">
                <span class="t-caption plan-block__time num">14:00 – 15:00</span>
                <span class="badge badge--user t-micro">직접 추가</span>
              </div>
              <p class="t-h3 plan-block__title">오답 노트 정리</p>
            </div>
          </li>

          <!-- 예정 -->
          <li class="plan-block">
            <button class="plan-block__check" aria-label="완료 표시"></button>
            <div>
              <div class="plan-block__head">
                <span class="t-caption plan-block__time num">20:00 – 21:00</span>
                <span class="badge badge--ai t-micro">AI 추천</span>
              </div>
              <p class="t-h3 plan-block__title">데이터베이스 구축 파트</p>
              <p class="t-caption plan-block__meta">AI 예상 소요시간 1시간</p>
            </div>
          </li>

        </ul>
      </section>

    </div><!-- /screen -->

    <!-- 진행 중 미니바 — 집중 세션 중일 때만 -->
    <div class="minibar" role="button" tabindex="0">
      <i class="minibar__dot"></i>
      <span class="t-caption minibar__label">집중 중 · 기출문제 풀이</span>
      <span class="t-caption minibar__time num">24:13</span>
    </div>

    <!-- 하단 탭바 -->
    <nav class="tabbar">
      <button class="tabbar__item" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M4 9.5L11 4l7 5.5V18a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1V9.5Z"
                stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="t-micro">홈</span>
      </button>
      <button class="tabbar__item">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <path d="M5 17V11M11 17V5M17 17v-4" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="t-micro">통계</span>
      </button>
      <button class="tabbar__item">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
          <circle cx="11" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/>
          <path d="M4.5 18c.9-3 3.4-4.5 6.5-4.5S16.6 15 17.5 18"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="t-micro">마이페이지</span>
      </button>
    </nav>

  </div><!-- /phone -->
</div>

</body>
</html>
